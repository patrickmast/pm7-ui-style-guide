<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrick — Brand Directions</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3efe8;color:#151515}
main{min-height:100vh;padding:48px 24px 72px;display:grid;place-items:center}
.wrap{width:min(1180px,100%)}h1{font-size:clamp(42px,7vw,88px);margin:0 0 10px;letter-spacing:-.055em}.sub{margin:0 0 36px;color:#6b655d;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{border-radius:30px;overflow:hidden;text-decoration:none;color:inherit;min-height:620px;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.12);transition:.2s transform}
.card:hover{transform:translateY(-4px)}.art{flex:1;display:grid;place-items:center;position:relative}.script .art{background:linear-gradient(145deg,#101214,#24201c)}.varsity .art{background:linear-gradient(145deg,#071a31,#0d2a4a)}
.p-script{font-family:"Brush Script MT","Segoe Script",cursive;font-weight:700;font-style:italic;font-size:clamp(170px,24vw,300px);line-height:.8;color:#f5ead6;text-shadow:0 0 0 #c49a55,2px 2px 0 #c49a55,-2px -2px 0 #c49a55}
.p-varsity{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:clamp(165px,23vw,280px);line-height:.8;color:#c4142e;-webkit-text-stroke:16px #f5f2e8;paint-order:stroke fill;filter:drop-shadow(0 0 0 #071a31) drop-shadow(5px 5px 0 #071a31) drop-shadow(-5px -5px 0 #071a31)}
.info{padding:28px 30px 30px;background:#fff}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#82796d}.info h2{margin:9px 0 6px;font-size:28px}.info p{margin:0;color:#6f6a63}.badge{position:absolute;top:24px;left:24px;color:#fff;border:1px solid rgba(255,255,255,.28);padding:8px 12px;border-radius:999px;font-size:12px;letter-spacing:.12em}
@media(max-width:760px){.grid{grid-template-columns:1fr}.card{min-height:520px}}
</style>
</head>
<body><main><div class="wrap">
<h1>Patrick</h1><p class="sub">Two logo directions.</p>
<div class="grid">
<a class="card script" href="./elegant.html"><div class="art"><span class="badge">01</span><div class="p-script">P</div></div><div class="info"><div class="eyebrow">Elegant</div><h2>Script P</h2><p>Refined, personal and premium.</p></div></a>
<a class="card varsity" href="./varsity.html"><div class="art"><span class="badge">02</span><div class="p-varsity">P</div></div><div class="info"><div class="eyebrow">American varsity</div><h2>Varsity P</h2><p>Bold collegiate character.</p></div></a>
</div></div></main><!-- trigger vercel deploy -->
</body></html>
